name: Earshot
options:
  deploymentTarget:
    iOS: "26.0"
packages:
  # The transcription pipeline (Whisper, rules, renderers).
  EarshotCore:
    path: ../core
  # Decodes the clip's Opus audio. libopus wrapped for Swift, BSD-3-Clause.
  Opus:
    url: https://github.com/alta/swift-opus
    exactVersion: 0.0.2
targets:
  Earshot:
    type: application
    platform: iOS
    sources:
      - path: Earshot
      # whisper.cpp's Swift wrapper lives with the pipeline; it builds against whisper.xcframework here
      - path: ../core/Sources/EarshotWhisper/WhisperTranscriber.swift
        group: Earshot/Pipeline
      - path: ../shared/formulary.json
        buildPhase: resources
      - path: ../shared/ems_terms.json
        buildPhase: resources
      # Whisper models (app/scripts/fetch_deps.sh); a model can also be copied into Documents
      - path: Models
        type: folder
        buildPhase: resources
        optional: true
    dependencies:
      - package: EarshotCore
        product: EarshotCore
      - framework: Frameworks/whisper.xcframework
        embed: true
      - package: Opus
    info:
      path: Earshot/Info.plist
      properties:
        CFBundleDisplayName: Earshot
        UIAppFonts: [Doto.ttf, Geist.ttf]
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: Earshot listens to the call so it can write the transcript.
        NSSpeechRecognitionUsageDescription: Earshot turns what is said on the call into text.
        NSBluetoothAlwaysUsageDescription: Earshot uses Bluetooth to connect to your clip.
        # audio: a recording carries on when the app is not on screen. bluetooth-central: so does the link to the clip.
        UIBackgroundModes: [audio, bluetooth-central]
        UIStatusBarHidden: true
        UIFileSharingEnabled: true          # copy a Whisper model into Documents from Finder
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mihirargulkar.earshot
        DEVELOPMENT_TEAM: JLPY9QPX7B
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
