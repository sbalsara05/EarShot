name: Earshot
options:
  deploymentTarget:
    iOS: "26.0"
packages:
  # Audio to transcript lines with Whisper. Run transcribe/fetch.sh once before building.
  Transcribe:
    path: ../transcribe
  # Decodes the clip's Opus audio. libopus wrapped for Swift, BSD-3-Clause.
  Opus:
    url: https://github.com/alta/swift-opus
    exactVersion: 0.0.2
targets:
  Earshot:
    type: application
    platform: iOS
    sources:
      - path: Earshot
      # The Whisper model: small.en fine-tuned on EMS speech, 488 MB, kept in Git LFS (transcribe/fetch.sh pulls it).
      # Without it the app builds and uses live words only.
      - path: ../transcribe/Models/ggml-ems-small.en-ft-f16.bin
        buildPhase: resources
        optional: true
    dependencies:
      - package: Opus
      - package: Transcribe
    postBuildScripts:
      # Settings shows which branch and commit a build came from.
      - name: Stamp the branch
        basedOnDependencyAnalysis: false
        script: |
          plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          branch=$(git -C "$SRCROOT" rev-parse --abbrev-ref HEAD 2>/dev/null || echo unknown)
          commit=$(git -C "$SRCROOT" rev-parse --short HEAD 2>/dev/null || echo unknown)
          [ -n "$(git -C "$SRCROOT" status --porcelain 2>/dev/null)" ] && commit="$commit, with changes not yet committed"
          /usr/libexec/PlistBuddy -c "Delete :GitBranch" "$plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :GitBranch string $branch" "$plist"
          /usr/libexec/PlistBuddy -c "Delete :GitCommit" "$plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :GitCommit string $commit" "$plist"
    info:
      path: Earshot/Info.plist
      properties:
        CFBundleDisplayName: Earshot
        UIAppFonts: [Doto.ttf, Geist.ttf]
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: Earshot listens to the call so it can write the transcript.
        NSSpeechRecognitionUsageDescription: Earshot turns what is said on the call into text.
        NSBluetoothAlwaysUsageDescription: Earshot uses Bluetooth to connect to your clip.
        NSLocationWhenInUseUsageDescription: Earshot notes where a call takes place, so the report can say where the patient was found and taken.
        NSLocationAlwaysAndWhenInUseUsageDescription: Earshot keeps noting where a call takes place while the screen is off or another app is open, so the report can say where the patient was found and taken.
        # audio: a recording carries on when the app is not on screen. bluetooth-central: so does the link to the clip.
        # location: so does the once-a-minute place check.
        UIBackgroundModes: [audio, bluetooth-central, location]
        UIStatusBarHidden: true
        UIFileSharingEnabled: true   # a Whisper model can be copied into the app's Documents folder from Finder
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mihirargulkar.earshot
        DEVELOPMENT_TEAM: JLPY9QPX7B
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"   # the branch stamp reads git
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
