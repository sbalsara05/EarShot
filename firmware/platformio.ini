; Device builds.
;
;   pio run -e atom-voices3r -t upload   the real clip: M5Stack Atom VoiceS3R
;   pio run -e feather-s3 -t upload      stand-in board: Adafruit ESP32-S3 Feather (no microphone;
;                                        plays a built-in voice recording instead)
;   pio device monitor                   serial log
;   pio run -e wokwi                     build for the Wokwi virtual ESP32-S3 (see README, "Wokwi")
;
; Laptop-side tests and the local simulator do not use PlatformIO; see the Makefile.

[platformio]
default_envs = atom-voices3r

[env]
platform = espressif32@6.7.0
framework = arduino
monitor_speed = 115200

; Settings for the Atom VoiceS3R (ESP32-S3-PICO-1-N8R8), following M5Stack's own PlatformIO
; example: https://docs.m5stack.com/en/core/Atom_VoiceS3R
[atom]
board = esp32-s3-devkitc-1
memory_type = qio_opi
build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

[env:atom-voices3r]
board = ${atom.board}
board_build.arduino.memory_type = ${atom.memory_type}
build_flags =
    ${atom.build_flags}
    -DEARSHOT_BOARD_ATOM
lib_deps =
    M5Unified=https://github.com/m5stack/M5Unified
    adafruit/Adafruit NeoPixel@^1.12.0
    sh123/esp32_opus@^1.0.3
    h2zero/NimBLE-Arduino@^2.3.0

; Adafruit ESP32-S3 Feather: the same chip as the Atom, used until the Atom arrives. It has no
; microphone, so the firmware plays a stored voice recording as if it were one. The button is
; the board's BOOT button and the light is its single onboard NeoPixel.
; This is the 4 MB flash / 2 MB PSRAM board; the image also runs on the 8 MB no-PSRAM one.
[env:feather-s3]
board = adafruit_feather_esp32s3
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DEARSHOT_BOARD_FEATHER
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0
    sh123/esp32_opus@^1.0.3
    h2zero/NimBLE-Arduino@^2.3.0

; Same firmware for Wokwi's virtual board: real button, LED ring and Wi-Fi code,
; generated tone in place of the microphone (Wokwi does not simulate I2S on the ESP32-S3,
; nor Bluetooth, so this build always uses Wi-Fi).
[env:wokwi]
board = ${atom.board}
board_build.arduino.memory_type = ${atom.memory_type}
build_flags =
    ${atom.build_flags}
    -DEARSHOT_WOKWI
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0
; no Opus in the Wokwi build: the emulated chip cannot encode it in real time
lib_ignore = earshot_opus
